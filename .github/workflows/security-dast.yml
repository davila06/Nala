name: DAST Security Baseline

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Start frontend preview
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/pawtrack-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173/ && break
            sleep 2
          done

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:4173
          fail_action: true
          allow_issue_writing: false
          cmd_options: "-a"

      - name: Upload preview log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-preview-log
          path: /tmp/pawtrack-preview.log
