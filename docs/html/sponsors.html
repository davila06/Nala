<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pitch para Inversionistas - PawTrack CR</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  </head>
  <body>
    <aside id="sidebar">
      <div class="brand">
        <span>🐾</span><strong>PawTrack CR<br />Documentación</strong>
      </div>
      <nav>
        <ul>
          <li><a href="index.html" class="h2">← Inicio</a></li>
          <li>
            <a href="inversionistas.html" class="h2 active"
              >💼 Pitch para inversionistas</a
            >
          </li>
          <li><a href="influencer.html" class="h2">🤝 Colaboraciones</a></li>
        </ul>
      </nav>
    </aside>
    <main id="main">
      <div id="content">
        <p style="color: #888; padding: 2rem">Cargando…</p>
      </div>
    </main>
    <script>
      fetch("../inversionistas.md")
        .then((response) => {
          if (!response.ok)
            throw new Error("No se pudo cargar inversionistas.md");
          return response.text();
        })
        .then((markdown) => {
          document.getElementById("content").innerHTML = DOMPurify.sanitize(
            marked.parse(markdown),
          );
        })
        .catch((error) => {
          document.getElementById("content").innerHTML =
            '<h1>No se pudo cargar la fuente</h1><p>Abre este documento desde un servidor local o consulta <a href="../inversionistas.md">inversionistas.md</a>.</p>';
          console.error(error);
        });
    </script>
  </body>
</html>
