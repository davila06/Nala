const md = "# PawTrack CR — Guía de Publicidad: Vallas In-App\r\n\r\n> **Audiencia:** Equipo de ventas, Admin de PawTrack CR  \r\n> **Versión:** 1.0 | **Última actualización:** 2026-08-19  \r\n> **Confidencialidad:** Uso interno — no compartir directamente con clientes\r\n\r\n---\r\n\r\n## Tabla de contenidos\r\n\r\n1. [¿Qué son las vallas in-app?](#1-qué-son-las-vallas-in-app)\r\n2. [Los 4 placements disponibles](#2-los-4-placements-disponibles)\r\n3. [Planes y precios](#3-planes-y-precios)\r\n4. [Descuentos y condiciones especiales](#4-descuentos-y-condiciones-especiales)\r\n5. [Quién puede anunciarse](#5-quién-puede-anunciarse)\r\n6. [Información que se le solicita al cliente](#6-información-que-se-le-solicita-al-cliente)\r\n7. [Especificaciones técnicas del diseño](#7-especificaciones-técnicas-del-diseño)\r\n8. [Proceso de activación paso a paso](#8-proceso-de-activación-paso-a-paso)\r\n9. [Cómo configurar la valla en el panel Admin](#9-cómo-configurar-la-valla-en-el-panel-admin)\r\n10. [Políticas de contenido y restricciones](#10-políticas-de-contenido-y-restricciones)\r\n11. [Preguntas frecuentes del cliente](#11-preguntas-frecuentes-del-cliente)\r\n12. [Plantillas de contacto comercial](#12-plantillas-de-contacto-comercial)\r\n13. [Seguimiento y renovación](#13-seguimiento-y-renovación)\r\n\r\n---\r\n\r\n## 1. ¿Qué son las vallas in-app?\r\n\r\nLas vallas publicitarias de PawTrack CR son **tarjetas visuales dismissibles** que aparecen en ubicaciones estratégicas dentro de la aplicación web. Se muestran a dueños de mascotas y público general que usa la plataforma.\r\n\r\n### Características clave para el cliente\r\n\r\n- **Sin instalación**: la plataforma ya está activa — el anuncio aparece inmediatamente al activarlo.\r\n- **Audience 100% relevante**: solo personas que tienen o buscan mascotas.\r\n- **No invasivas**: el usuario puede cerrarla; no vuelve a aparecer en 24 horas.\r\n- **Con llamado a la acción (CTA)**: botón que lleva directamente al sitio web o WhatsApp del anunciante.\r\n- **Imagen + texto**: visual atractivo con título, descripción y botón.\r\n\r\n---\r\n\r\n## 2. Los 4 placements disponibles\r\n\r\n### 🗺️ Placement: MAP — Mapa público\r\n\r\n**¿Dónde aparece?**  \r\nOverlay flotante en la esquina inferior izquierda del mapa interactivo público (`/mapa`). Visible para TODOS los visitantes, incluidos los no registrados.\r\n\r\n**¿Quién lo ve?**  \r\n- Cualquier persona que escanea un QR y abre el mapa\r\n- Usuarios buscando mascotas perdidas en la zona\r\n- Personas explorando la app sin cuenta\r\n\r\n**Perfil del visitante:**  \r\nAlta diversidad. Dueños de mascotas, rescatistas, vecinos curiosos. Momento emocional: están usando el mapa activamente.\r\n\r\n**Ideal para:**  \r\nTiendas de mascotas con dirección física, veterinarias sin plan ClinicPartner, distribuidores de collares GPS, seguros de mascotas, pet groomers.\r\n\r\n**Visibilidad estimada:** ★★★★☆ (alta — tráfico público)\r\n\r\n---\r\n\r\n### 🏠 Placement: DASHBOARD — Panel del dueño\r\n\r\n**¿Dónde aparece?**  \r\nEntre las tarjetas de mascotas del dueño autenticado (`/dashboard`), debajo de la sección de alertas de salud y antes del leaderboard.\r\n\r\n**¿Quién lo ve?**  \r\nSolo usuarios con sesión activa que tienen al menos una mascota registrada.\r\n\r\n**Perfil del visitante:**  \r\nEl dueño más comprometido: revisa sus mascotas regularmente, tiene plan activo o gratuito. Alta probabilidad de compra de productos/servicios relacionados.\r\n\r\n**Ideal para:**  \r\nAlimentos premium, grooming, veterinarias locales, seguros, juguetes y accesorios, hoteles para mascotas, productos de salud (antipulgas, desparasitantes).\r\n\r\n**Visibilidad estimada:** ★★★☆☆ (media — audiencia calificada)\r\n\r\n---\r\n\r\n### 🗂️ Placement: DIRECTORY — Directorio de tiendas\r\n\r\n**¿Dónde aparece?**  \r\nJusto debajo del encabezado en el directorio público de tiendas (`/tiendas`), antes del buscador de tiendas.\r\n\r\n**¿Quién lo ve?**  \r\nUsuarios que están activamente explorando tiendas de mascotas para comprar.\r\n\r\n**Perfil del visitante:**  \r\nAlta intención de compra. Ya está en modo \"quiero comprar algo para mi mascota\". Es el momento perfecto para interrumpir con una oferta.\r\n\r\n**Ideal para:**  \r\nTiendas con plan StoreBasic que quieren más visibilidad, marcas de alimento o accesorios, tiendas que no están en PawTrack pero quieren capturar tráfico.\r\n\r\n**Visibilidad estimada:** ★★★☆☆ (media — alta intención de compra)\r\n\r\n---\r\n\r\n### 📋 Placement: FEED — Feed de mascotas perdidas\r\n\r\n**¿Dónde aparece?**  \r\nSobre la lista de mascotas perdidas activas en el panel lateral del mapa.\r\n\r\n**¿Quién lo ve?**  \r\nPersonas activamente involucradas en reportes de mascotas perdidas: dueños desesperados, rescatistas, vecinos solidarios.\r\n\r\n**Perfil del visitante:**  \r\nMomento de alta emoción. Estas personas son extremadamente receptivas a soluciones que ayuden a encontrar mascotas.\r\n\r\n**Ideal para:**  \r\nServicios de búsqueda profesional de mascotas, collares GPS (Tractive), chips RFID, comunidades de rescate, agencias de seguridad privada con servicios de búsqueda.\r\n\r\n**Visibilidad estimada:** ★★★★★ (muy alta — máximo engagement emocional)\r\n\r\n> ⚠️ **Nota de ética**: Por respeto a los usuarios en situación de crisis, el Feed solo acepta anuncios directamente relacionados con recuperación de mascotas. No se aceptan anuncios de comida, accesorios u otros productos no relacionados en este placement.\r\n\r\n---\r\n\r\n## 3. Planes y precios\r\n\r\n> Precios en colones costarricenses (₡). Referencia: ~520 ₡/USD.  \r\n> IVA no incluido. Método de pago: SINPE Móvil.\r\n\r\n### 3.1 Tarifa por placement y duración\r\n\r\n| Placement | 1 semana | 1 mes | 3 meses | 6 meses | 12 meses |\r\n|-----------|:--------:|:-----:|:-------:|:-------:|:--------:|\r\n| 🗺️ **Map** | ₡18,000 | ₡55,000 | ₡140,000 | ₡240,000 | ₡400,000 |\r\n| 🏠 **Dashboard** | ₡10,000 | ₡30,000 | ₡75,000 | ₡130,000 | ₡220,000 |\r\n| 🗂️ **Directory** | ₡12,000 | ₡35,000 | ₡90,000 | ₡155,000 | ₡260,000 |\r\n| 📋 **Feed** | ₡22,000 | ₡65,000 | ₡165,000 | ₡290,000 | ₡490,000 |\r\n\r\n### 3.2 Paquetes combinados\r\n\r\n| Paquete | Descripción | Precio/mes | Precio/año | Ahorro anual |\r\n|---------|-------------|:----------:|:----------:|:------------:|\r\n| 🟢 **Starter** | Map — 1 semana | ₡18,000 | — | — |\r\n| 🔵 **Visibilidad** | Map + Dashboard — 1 mes | ₡75,000 | ₡720,000 | ₡180,000 |\r\n| 🟣 **Presencia** | Todos los 4 placements — 1 mes | ₡175,000 | ₡1,680,000 | ₡420,000 |\r\n| 🟡 **Socio Anual** | Todos los 4 placements — 12 meses | — | ₡1,400,000 | ₡700,000 |\r\n\r\n### 3.3 Add-on: Exclusividad de categoría\r\n\r\nSi un anunciante quiere ser el **único de su categoría** visible en un placement durante su período:\r\n\r\n| Duración | Cargo adicional |\r\n|----------|:---------------:|\r\n| 1 semana | +₡8,000 |\r\n| 1 mes | +₡20,000 |\r\n| 3 meses | +₡50,000 |\r\n\r\nEjemplo: una veterinaria paga la exclusividad de categoría en Map — ninguna otra veterinaria puede tener valla en Map durante ese período.\r\n\r\n---\r\n\r\n## 4. Descuentos y condiciones especiales\r\n\r\n| Condición | Descuento |\r\n|-----------|:---------:|\r\n| Cliente con plan StorePlus o StorePartner activo | **20%** en cualquier valla |\r\n| Cliente con plan ClinicPlus o ClinicPartner activo | **20%** en cualquier valla |\r\n| Pago de 6 o 12 meses por adelantado | **25–30%** (ya reflejado en la tabla) |\r\n| ONG o aliado verificado sin fines de lucro | **50%** o gratis en Feed temporalmente |\r\n| Primera valla de un nuevo anunciante (prueba) | **1 semana en Map gratis** |\r\n| Referido: otro cliente que refiere al nuevo anunciante | ₡10,000 de crédito al referidor |\r\n\r\n> Los descuentos no son acumulables entre sí. Se aplica el mayor descuento disponible.\r\n\r\n---\r\n\r\n## 5. Quién puede anunciarse\r\n\r\n### ✅ Se acepta\r\n\r\n- Tiendas de productos para mascotas (alimentos, accesorios, grooming, ropa)\r\n- Veterinarias y clínicas animales\r\n- Groomers y spa para mascotas\r\n- Hoteles y guarderías para mascotas\r\n- Distribuidores de collares GPS y tecnología para mascotas\r\n- Seguros para mascotas\r\n- Servicios de entrenamiento de perros\r\n- Refugios y organizaciones de rescate (con descuento especial)\r\n- Servicios de adopción responsable\r\n- Fotografía de mascotas\r\n- Empresas de alimento y suplementos veterinarios\r\n\r\n### ❌ No se acepta\r\n\r\n- Anuncios no relacionados con mascotas (banco, telefonía, ropa, etc.)\r\n- Casas de apuestas o juegos de azar\r\n- Contenido político o religioso\r\n- Competidores directos de PawTrack CR (plataformas de mascotas similares)\r\n- Servicios o productos de dudosa procedencia veterinaria\r\n- Anuncios que afirmen curar enfermedades sin respaldo científico\r\n- Imágenes que muestren maltrato animal (aunque sea en contexto de rescate)\r\n\r\n### ⚠️ Sujeto a revisión caso a caso\r\n\r\n- Criadores de mascotas (permitido solo si promueven adopción responsable)\r\n- Servicios de venta de mascotas (no se acepta si no hay política anti-tienda-de-cachorros)\r\n- Farmacias veterinarias (verificar que sean establecimientos legales)\r\n\r\n---\r\n\r\n## 6. Información que se le solicita al cliente\r\n\r\n### 6.1 Información básica del anunciante\r\n\r\nSolicitar por WhatsApp o email antes de crear la valla:\r\n\r\n```\r\n□ Nombre del negocio\r\n□ Nombre del contacto responsable\r\n□ Teléfono de contacto (WhatsApp preferido)\r\n□ Correo electrónico\r\n□ Sitio web o perfil de Instagram/Facebook (si tienen)\r\n□ Número SINPE para confirmación de pago\r\n□ Cedula jurídica o cédula física (para factura, si aplica)\r\n```\r\n\r\n### 6.2 Información de la valla\r\n\r\n```\r\n□ Placement elegido: Map / Dashboard / Directory / Feed\r\n□ Duración: 1 semana / 1 mes / 3 meses / 6 meses / 12 meses\r\n□ Fecha de inicio deseada (o \"lo antes posible\")\r\n□ Fecha de fin (se calcula automáticamente, confirmar con el cliente)\r\n\r\n□ CONTENIDO DE LA VALLA:\r\n   - Título (máx. 120 caracteres)\r\n     Ejemplo: \"Kibbles Premium — Envío gratis en Desamparados 🐕\"\r\n   \r\n   - Descripción (máx. 300 caracteres, opcional)\r\n     Ejemplo: \"Primera bolsa de alimento holístico con 15% de descuento para nuevos clientes. Solo esta semana.\"\r\n   \r\n   - Texto del botón CTA (máx. 60 caracteres, opcional)\r\n     Ejemplo: \"Ver oferta →\" o \"Escríbenos por WhatsApp\"\r\n   \r\n   - URL destino del botón (donde va el usuario al hacer clic)\r\n     Ejemplo: https://wa.me/50688881234 o https://mitienda.com/oferta\r\n   \r\n   - Imagen (ver especificaciones en §7)\r\n     ¿El cliente tiene imagen? ¿O necesita que PawTrack diseñe?\r\n```\r\n\r\n### 6.3 Preferencias adicionales\r\n\r\n```\r\n□ ¿Quiere exclusividad de categoría? (cargo adicional)\r\n□ ¿Tiene descuento aplicable? (plan StorePlus, ClinicPartner, etc.)\r\n□ ¿Es su primera valla con PawTrack? (1 semana gratis en Map)\r\n□ Horario para coordinar la revisión y activación\r\n```\r\n\r\n---\r\n\r\n## 7. Especificaciones técnicas del diseño\r\n\r\n### 7.1 Imagen\r\n\r\n| Parámetro | Especificación |\r\n|-----------|---------------|\r\n| **Formatos aceptados** | JPEG, PNG, WebP |\r\n| **Tamaño máximo** | 5 MB |\r\n| **Dimensiones recomendadas** | 1200 × 628 px (ratio 1.9:1) |\r\n| **Mínimo recomendado** | 600 × 315 px |\r\n| **El sistema redimensiona a** | máx. 1200px (automático) |\r\n| **Calidad de compresión** | 85% JPEG (automático) |\r\n\r\n### 7.2 Composición recomendada de la imagen\r\n\r\n```\r\n┌─────────────────────────────────────────────────────────┐\r\n│                                                         │\r\n│   LOGO del anunciante                                   │\r\n│   (esquina sup. izquierda)                              │\r\n│                                                         │\r\n│         IMAGEN PRINCIPAL                                │\r\n│     (producto, mascota, servicio)                       │\r\n│                                                         │\r\n│   Texto en imagen (opcional, máx 1-2 palabras grandes)  │\r\n│                                                         │\r\n└─────────────────────────────────────────────────────────┘\r\n```\r\n\r\n> **Evitar**: textos muy pequeños, fondos blancos sin contraste, imágenes de mala resolución, textos que dupliquen el título/descripción que ya se muestran debajo de la imagen.\r\n\r\n### 7.3 Texto de la valla (en la app)\r\n\r\n| Campo | Límite | Obligatorio | Notas |\r\n|-------|--------|:-----------:|-------|\r\n| Título | 120 caracteres | ✅ | Se muestra en negrita debajo de la imagen |\r\n| Descripción | 300 caracteres | ❌ | Texto más pequeño, máx 2-3 líneas visibles |\r\n| CTA texto | 60 caracteres | ❌ | Botón verde con el texto del cliente |\r\n| CTA URL | Sin límite práctico | Solo si hay CTA | Debe ser HTTPS o WhatsApp |\r\n\r\n### 7.4 URLs permitidas para el CTA\r\n\r\n```\r\n✅  https://mitienda.com\r\n✅  https://www.instagram.com/mitienda\r\n✅  https://wa.me/50688881234  ← WhatsApp directo (muy recomendado)\r\n✅  https://maps.google.com/...\r\n❌  http:// (sin HTTPS)\r\n❌  URLs de descarga de archivos\r\n❌  URLs de redes sociales no verificadas\r\n```\r\n\r\n---\r\n\r\n## 8. Proceso de activación paso a paso\r\n\r\n### Paso 1 — Primer contacto y cotización (día 0)\r\n\r\n1. Cliente contacta por WhatsApp o email.\r\n2. Enviar la cotización basada en placement + duración elegidos.\r\n3. Si aplica descuento, aplicarlo ya en la cotización.\r\n4. Confirmar si es su primera valla (1 semana gratis en Map).\r\n\r\n### Paso 2 — Recopilar materiales (día 1-2)\r\n\r\nSolicitar al cliente (puede ser por WhatsApp):\r\n- La imagen en la resolución correcta\r\n- El título, descripción y texto del botón\r\n- La URL destino del botón\r\n- Fecha de inicio deseada\r\n\r\n> **Tip**: muchos clientes no tienen imagen lista. En ese caso, se puede:\r\n> - Pedirles que envíen su logo + foto del producto/local y crearla en Canva (~15 min)\r\n> - Cobrar ₡10,000 adicionales por diseño si el volumen lo justifica\r\n> - Ofrecer la 1ª semana gratis extendida a 2 semanas si necesitan tiempo para diseñar\r\n\r\n### Paso 3 — Revisión de contenido (día 2)\r\n\r\nVerificar que:\r\n- [ ] La imagen cumple las especificaciones técnicas\r\n- [ ] El contenido no viola las políticas (§10)\r\n- [ ] La URL del CTA funciona correctamente\r\n- [ ] El negocio califica para anunciarse (§5)\r\n\r\n### Paso 4 — Confirmar pago (día 2-3)\r\n\r\n1. Enviar al cliente el número SINPE de PawTrack CR.\r\n2. Indicar el monto exacto con el concepto: `\"Valla PawTrack - [Nombre negocio] - [Placement] - [Período]\"`.\r\n3. Confirmar recepción del comprobante de pago.\r\n\r\n> **No activar la valla antes de confirmar el pago.** En caso de primera semana gratis, activar inmediatamente.\r\n\r\n### Paso 5 — Crear y activar la valla (día 3)\r\n\r\nVer el §9 para instrucciones detalladas de configuración en el panel Admin.\r\n\r\nTiempo estimado de configuración: **10-15 minutos**.\r\n\r\n### Paso 6 — Confirmación al cliente (día 3)\r\n\r\nEnviar al cliente:\r\n- Screenshot de la valla activa en la app\r\n- Las fechas exactas de inicio y fin\r\n- La URL donde pueden verla: `https://pawtrack.cr/mapa` (para Map) o según el placement\r\n\r\n### Paso 7 — Seguimiento (días 5, 15, último día)\r\n\r\n- Día 5: mensaje de bienvenida y confirmación de que la valla se ve bien\r\n- Día 15 (si es mensual): recordar que quedan 2 semanas, preguntar si quieren renovar\r\n- Día anterior al vencimiento: ofrecer renovación con descuento por lealtad\r\n\r\n---\r\n\r\n## 9. Cómo configurar la valla en el panel Admin\r\n\r\n### 9.1 Acceder al panel\r\n\r\n1. Iniciar sesión con cuenta Admin en `https://pawtrack.cr`.\r\n2. Navegar a `/admin`.\r\n3. Hacer clic en el tab **🪧 Vallas**.\r\n\r\n### 9.2 Crear una nueva valla\r\n\r\n1. Click en **+ Nueva valla**.\r\n2. Completar el formulario:\r\n\r\n| Campo | Valor a ingresar |\r\n|-------|-----------------|\r\n| **Título** | Texto exacto del cliente (máx 120 chars) |\r\n| **Descripción** | Texto de apoyo del cliente (o dejar vacío) |\r\n| **Ubicación (Placement)** | Map / Dashboard / Directory / Feed |\r\n| **Inicio** | Fecha y hora de inicio (usar 00:00 para inicio del día) |\r\n| **Fin** | Fecha y hora de fin (usar 23:59 del último día) |\r\n| **CTA Texto** | Texto del botón (o dejar vacío si no hay CTA) |\r\n| **CTA URL** | URL de destino del botón |\r\n| **Prioridad** | Ver tabla de prioridades abajo |\r\n\r\n### 9.3 Tabla de prioridades por plan\r\n\r\n| Tipo de cliente | Prioridad asignada |\r\n|----------------|:-----------------:|\r\n| Socio Anual (todos los placements 12 meses) | 90-100 |\r\n| Paquete Presencia Completa (4 placements) | 70-85 |\r\n| Cliente 3-6 meses | 50-65 |\r\n| Cliente mensual | 30-45 |\r\n| Cliente semanal / primera valla | 10-25 |\r\n| Valla interna PawTrack (propia) | 1-5 |\r\n\r\n> Un cliente que paga más = prioridad más alta = se muestra primero si hay varias activas en el mismo placement.\r\n\r\n### 9.4 Subir la imagen\r\n\r\n1. Hacer click en **+ Nueva valla** → completar el formulario → **Crear valla**.\r\n2. La valla aparece en la lista en estado `Draft`.\r\n3. Click en **📷 Imagen** en la fila de esa valla.\r\n4. Seleccionar el archivo del cliente (JPEG/PNG/WebP, máx 5MB).\r\n5. El sistema hace resize automático a 1200px y guarda en Blob Storage.\r\n\r\n### 9.5 Activar la valla\r\n\r\n1. Con la imagen ya subida, verificar que todo se vea bien.\r\n2. Click en **Activar** en la fila de la valla.\r\n3. El estado cambia de `Draft` → `Active`.\r\n4. La valla aparece inmediatamente en la app (dentro de los 5 minutos de caché).\r\n\r\n### 9.6 Pausar o ajustar una valla activa\r\n\r\nSi el cliente necesita cambiar algo (error en el texto, cambio de imagen):\r\n1. Click en **Pausar** → estado cambia a `Paused`.\r\n2. Para cambiar la imagen: click en **📷 Imagen** y subir la nueva.\r\n3. Para cambiar texto: actualmente requiere recrear la valla (pendiente en roadmap: edición directa).\r\n4. Click en **Activar** para reanudar.\r\n\r\n> El tiempo que la valla esté pausada **no se descuenta** del período pagado si la pausa la solicita PawTrack por un ajuste técnico. Si el cliente pide pausarla, el tiempo sí corre.\r\n\r\n---\r\n\r\n## 10. Políticas de contenido y restricciones\r\n\r\n### 10.1 Imágenes\r\n\r\n- No se aceptan imágenes con pixelación visible o de baja calidad\r\n- No se aceptan imágenes que muestren marcas de competidores directos de PawTrack\r\n- No se aceptan imágenes de mascotas en condiciones de maltrato o abandono (aunque sea para concientizar)\r\n- Las imágenes de mascotas deben ser reales o ilustraciones de calidad — no memes ni humor degradante\r\n\r\n### 10.2 Textos\r\n\r\n- Sin afirmaciones médicas no respaldadas (\"cura el cáncer\", \"previene 100% de enfermedades\")\r\n- Sin precios que luego no coinciden con el sitio del cliente (publicidad engañosa)\r\n- Sin lenguaje de urgencia falsa (\"¡Solo quedan 2 unidades!\" si no es real)\r\n- El idioma principal debe ser español (textos en inglés solo aceptables como marca/slogan)\r\n\r\n### 10.3 URLs\r\n\r\n- La URL del CTA debe llevar al sitio/WhatsApp real del anunciante\r\n- No se permiten links de afiliados de Amazon u otras plataformas de e-commerce externas\r\n- PawTrack CR se reserva el derecho de verificar la URL antes de activar\r\n\r\n### 10.4 Derechos de imagen\r\n\r\nEl cliente es responsable de tener los derechos sobre la imagen que envía. PawTrack CR no se hace responsable por infracción de derechos de autor por imágenes proporcionadas por el anunciante.\r\n\r\n---\r\n\r\n## 11. Preguntas frecuentes del cliente\r\n\r\n**¿Cuántas personas verán mi anuncio?**  \r\nDepende del placement y del crecimiento de la plataforma. En la etapa actual (lanzamiento), el Map recibe entre 100 y 500 visitas únicas diarias. A medida que crezca la red, la audiencia aumenta.\r\n\r\n**¿Puedo cambiar el anuncio mientras está activo?**  \r\nSí, podemos pausarlo temporalmente para hacer cambios en la imagen. Los textos se ajustan recreando la valla (tarda ~5 minutos). No tiene costo adicional si es un ajuste menor.\r\n\r\n**¿Qué pasa si el usuario cierra mi anuncio?**  \r\nEl sistema registra que ese usuario cerró esa valla específica y no la vuelve a mostrar por 24 horas. Al día siguiente puede aparecer de nuevo si el usuario regresa.\r\n\r\n**¿Puedo elegir en qué zona del país aparece el anuncio?**  \r\nActualmente no — las vallas se muestran a todos los usuarios sin segmentación geográfica. La segmentación por zona es una feature planificada para el futuro. Si es importante para tu negocio, el placement Map es el más cercano a geolocalización (el usuario ve el mapa de su zona).\r\n\r\n**¿Hay informes de cuántas personas hicieron clic?**  \r\nActualmente el sistema registra las vistas y clics internamente. Los reportes formales al anunciante son una feature en desarrollo. Por ahora se puede compartir capturas del panel.\r\n\r\n**¿Puedo cancelar antes de que termine mi período?**  \r\nLos pagos no son reembolsables una vez que la valla ha sido activada. Si hay un problema técnico de nuestra parte, se aplica una extensión equivalente al tiempo perdido.\r\n\r\n**¿Cuánto tiempo tarda en activarse mi anuncio?**  \r\nDesde que el cliente envía los materiales y confirma el pago, la activación tarda entre 1 y 3 horas hábiles.\r\n\r\n**¿Puedo tener más de una valla al mismo tiempo?**  \r\nSí. Un anunciante puede tener vallas en diferentes placements simultáneamente. También puede tener varias vallas en el mismo placement (con diferentes mensajes), todas activas al mismo tiempo, pero solo la de mayor prioridad se muestra al usuario en cada momento.\r\n\r\n---\r\n\r\n## 12. Plantillas de contacto comercial\r\n\r\n### 12.1 Primer contacto — WhatsApp\r\n\r\n```\r\nHola [Nombre] 👋\r\n\r\nSoy Denis de PawTrack CR, la plataforma de identidad digital de mascotas en Costa Rica.\r\n\r\nTenemos un espacio publicitario disponible en nuestra app — un anuncio visual que aparece directamente en el mapa interactivo visto por dueños de mascotas de toda la zona.\r\n\r\nLa primera semana es completamente gratuita como prueba para que veas los resultados.\r\n\r\n¿Te interesaría que te cuente más? 😊\r\n```\r\n\r\n### 12.2 Cotización formal — WhatsApp o email\r\n\r\n```\r\nHola [Nombre],\r\n\r\nCon gusto te comparto las opciones disponibles para [nombre del negocio] en PawTrack CR:\r\n\r\n📍 VALLA EN MAPA (más popular)\r\n   • 1 semana: ₡18,000\r\n   • 1 mes: ₡55,000\r\n   • 3 meses: ₡140,000\r\n\r\n🏠 VALLA EN DASHBOARD (dueños activos)\r\n   • 1 semana: ₡10,000\r\n   • 1 mes: ₡30,000\r\n\r\n🔥 PAQUETE COMPLETO (los 4 placements, 1 mes): ₡175,000\r\n\r\nComo es tu primera vez con nosotros, la primera semana en el Mapa es GRATIS — sin compromiso.\r\n\r\nSi quieres avanzar, solo necesito:\r\n1. La imagen del anuncio (o un logo y te ayudamos a diseñarla)\r\n2. El texto del anuncio (título + descripción corta)\r\n3. A dónde quieres que lleve el botón (tu sitio web o WhatsApp)\r\n\r\n¿Avanzamos? 🐾\r\n```\r\n\r\n### 12.3 Recordatorio de renovación (7 días antes de vencer)\r\n\r\n```\r\nHola [Nombre] 👋\r\n\r\nQuería avisarte que tu valla en PawTrack CR vence el [fecha].\r\n\r\n¿La renovamos? Por ser cliente frecuente, te hago un 15% de descuento en la renovación.\r\n\r\nLa renovación tarda 5 minutos y puede quedar lista hoy mismo.\r\n```\r\n\r\n### 12.4 Solicitud de materiales\r\n\r\n```\r\nPerfecto [Nombre]! Para activar tu valla necesito:\r\n\r\n1. 📸 IMAGEN: \r\n   - Formato: JPG, PNG o WebP\r\n   - Tamaño: mínimo 600×315 px (ideal 1200×628 px)\r\n   - Máximo: 5 MB\r\n   - Contenido: tu logo + imagen del producto/local\r\n\r\n2. ✍️ TEXTO:\r\n   - Título (máx 120 caracteres): [ej: \"20% off en alimentos Premium este mes 🐾\"]\r\n   - Descripción (opcional, máx 300 caracteres): [ej: \"Para nuevos clientes con código PAWTRACK\"]\r\n\r\n3. 🔗 BOTÓN (opcional):\r\n   - Texto del botón: [ej: \"Ver oferta\" o \"Escríbenos\"]\r\n   - Enlace: [tu sitio web o https://wa.me/506XXXXXXXX]\r\n\r\n4. 📅 FECHAS:\r\n   - ¿Cuándo quieres que empiece? (o \"lo antes posible\")\r\n\r\nCon eso, la tengo lista en menos de 1 hora ✅\r\n```\r\n\r\n---\r\n\r\n## 13. Seguimiento y renovación\r\n\r\n### 13.1 Calendario de seguimiento sugerido\r\n\r\n| Día | Acción |\r\n|-----|--------|\r\n| Día 1 (activación) | Enviar screenshot de confirmación + fecha de vencimiento |\r\n| Día 5 | Verificar que el cliente la haya visto, preguntar si tiene comentarios |\r\n| Día 15 (si es mensual) | \"¿Cómo vas? Quedan 2 semanas.\" |\r\n| Día -7 (antes de vencer) | Oferta de renovación con descuento de lealtad |\r\n| Día vencimiento | Confirmar si quiere renovar o dar de baja |\r\n\r\n### 13.2 Descuentos de renovación\r\n\r\n| Renovaciones consecutivas | Descuento |\r\n|--------------------------|:---------:|\r\n| 2ª renovación | 5% |\r\n| 3ª renovación | 10% |\r\n| 4ª+ renovación | 15% |\r\n\r\n### 13.3 Señales de que el cliente quiere más\r\n\r\n- Pregunta por reportes o estadísticas → ofrecerle plan más largo con datos comparables\r\n- Comenta que le han llegado clientes → caso de éxito, pedir referidos\r\n- Pregunta por otros placements → ofrecer paquete combinado\r\n- No renueva → hacer seguimiento a los 30 días: \"¿Cómo te fue? ¿Podemos mejorar algo?\"\r\n\r\n### 13.4 Registro de clientes\r\n\r\nMantener un registro simple (Google Sheets o similar) con:\r\n\r\n```\r\n| Cliente | Placement | Inicio | Fin | Monto | Estado | Notas |\r\n```\r\n\r\nEsto permite anticipar renovaciones y llevar el historial de pagos.\r\n\r\n---\r\n\r\n*PawTrack CR — Publicidad in-app para negocios del mundo mascota en Costa Rica.*  \r\n*Contacto: davila06@gmail.com | WhatsApp disponible previa coordinación*\r\n";
const html = DOMPurify.sanitize(marked.parse(md));
const content = document.getElementById('content');
content.innerHTML = html;
const headings = content.querySelectorAll('h2, h3');
const sidebar  = document.querySelector('#sidebar nav ul');
headings.forEach((h, i) => {
  if (!h.id) {
    h.id = 'h-' + i + '-' + h.textContent.toLowerCase()
      .replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,'-').slice(0,50);
  }
  const li = document.createElement('li');
  const a  = document.createElement('a');
  a.href = '#' + h.id;
  a.textContent = h.textContent.replace(/^#+\s*/, '');
  a.className = h.tagName.toLowerCase();
  li.appendChild(a);
  sidebar.appendChild(li);
});
const links = sidebar.querySelectorAll('a[href^="#"]');
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      links.forEach(l => l.classList.remove('active'));
      const active = sidebar.querySelector('a[href="#' + e.target.id + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-20% 0px -75% 0px' });
content.querySelectorAll('h2, h3').forEach(h => obs.observe(h));
</script>
